  <main class="login-page">
    <form class="login-card" action="#" method="post">
      <h1>欢迎登录</h1>
      <p class="login-sub">登录后即可管理你的作品与资源</p>

      <label for="username">用户名</label>
      <input type="text" id="username" name="username" placeholder="请输入用户名" autocomplete="username">

      <label for="password">密码</label>
      <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password">

      <p id="login-error" class="login-error" hidden></p>

      <button type="submit" class="login-btn">登录</button>

      <p class="login-hint">还没有账号？<a href="index.html#contact">联系我</a></p>
    </form>
  </main>

  <script>
    // ===== 登录逻辑：POST /api/login 验证，成功存 token 跳后台（Day 21 轻量版）=====
    var API_BASE = "https://changda-vibecoding-d8c0v64bdbf7c-1500185360.ap-shanghai.app.tcloudbase.com";

    var form = document.querySelector(".login-card");
    var usernameEl = document.getElementById("username");
    var passwordEl = document.getElementById("password");
    var errorEl = document.getElementById("login-error");
    var btn = document.querySelector(".login-btn");

    // 把裸报错翻译成中文人话（Day 23）：网络层错误（如 Failed to fetch）转成友好提示，
    // 后端返回的中文业务错误（如「用户名或密码错误」）原样保留。
    function toHumanError(err) {
      var msg = (err && err.message) || "";
      // 网络/连接类错误：浏览器会抛 TypeError: Failed to fetch 等英文
      if (/failed to fetch|network|load failed|fetch/i.test(msg)) {
        return "网络连接失败，请检查网络后重试";
      }
      // 其余返回中文提示兜底
      return msg || "操作失败，请稍后再试";
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      var username = usernameEl.value.trim();
      var password = passwordEl.value;

      if (!username || !password) {
        errorEl.textContent = "请输入用户名和密码";
        errorEl.hidden = false;
        return;
      }

      // 登录中：禁用按钮，避免重复提交
      btn.disabled = true;
      btn.textContent = "登录中…";
      errorEl.hidden = true;

      fetch(API_BASE + "/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: username, password: password })
      })
        .then(function (resp) { return resp.json(); })
        .then(function (json) {
          if (json && json.ok === true) {
            // 登录成功：存 token + 用户名，跳管理后台
            localStorage.setItem("admin_token", json.token);
            localStorage.setItem("admin_username", json.username);
            window.location.href = "admin.html";
          } else {
            throw new Error((json && json.error) || "登录失败");
          }
        })
        .catch(function (err) {
          errorEl.textContent = toHumanError(err);
          errorEl.hidden = false;
          btn.disabled = false;
          btn.textContent = "登录";
        });
    });
  </script>
