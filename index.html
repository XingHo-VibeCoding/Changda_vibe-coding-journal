<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>王畅达 · 个人主页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <img class="avatar" src="img-portrait.jpg" alt="王畅达的个人照片">
      <h1>王畅达</h1>
      <p class="subtitle">浙江大学自动化控制学生</p>
      <p class="motto">「此生尽兴，赤诚善良」</p>
    </header>

    <section class="contact">
      <h2>联系方式</h2>
      <ul>
        <li>邮箱：<a href="mailto:2898724740@qq.com">2898724740@qq.com</a></li>
        <li>电话：<a href="tel:19892774575">19892774575</a></li>
      </ul>
    </section>

    <section class="shares">
      <div class="section-head">
        <h2>分享</h2>
        <a class="more" href="share.html">更多 →</a>
      </div>
      <div class="card-grid" id="home-cards"></div>
    </section>
  </main>

  <script src="data.js"></script>
  <script>
    var grid = document.getElementById("home-cards");
    var cards = "";
    SITE_DATA.works.forEach(function (w) {
      cards +=
        '<a class="card" href="work.html?title=' + encodeURIComponent(w.title) + '">' +
          '<img class="card-img" src="' + w.img + '" alt="' + w.title + '">' +
          '<h3>' + w.title + '</h3>' +
          '<p>' + w.desc + '</p>' +
        '</a>';
    });
    grid.innerHTML = cards;
  </script>
</body>
</html>
