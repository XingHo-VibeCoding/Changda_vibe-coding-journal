  <main class="container">

      <p class="share-sub">我公开的作品与资源</p>
    </header>

    <nav class="filter">
      <button class="filter-btn is-active" type="button" data-filter="all">全部</button>
      <button class="filter-btn" type="button" data-filter="doodle">涂鸦</button>
      <button class="filter-btn" type="button" data-filter="essay">随笔</button>
      <button class="filter-btn" type="button" data-filter="photo">合影</button>
      <button class="filter-btn" type="button" data-filter="res">资源</button>
    </nav>

    <div id="state-loading" class="state" hidden>加载中…</div>
    <div id="state-empty" class="state" hidden>这里还没有内容</div>
    <div id="state-error" class="state" hidden>加载出错了，请稍后再试</div>

    <div id="list" class="list"></div>
  </main>

  <script src="data.js"></script>
  <script>
    var loadingEl = document.getElementById("state-loading");
    var emptyEl = document.getElementById("state-empty");
    var errorEl = document.getElementById("state-error");
    var listEl = document.getElementById("list");
    var btns = document.querySelectorAll(".filter-btn");
    var filter = "all";

    // 把四个板块合成一个列表（每项带上自己的类型标识）
    function getItems() {
      var items = [];
      SITE_DATA.doodles.forEach(function (w) {
        items.push({ type: "doodle", title: w.title, desc: w.desc, img: w.img });
      });
      SITE_DATA.essays.forEach(function (e) {
        items.push({ type: "essay", title: e.title, desc: e.desc, img: e.img || "" });
      });
      SITE_DATA.photos.forEach(function (p) {
        items.push({ type: "photo", title: p.title, desc: p.desc, img: p.img });
      });
      SITE_DATA.resources.forEach(function (r) {
        items.push({ type: "res", title: r.title, desc: r.desc, link: r.link || "" });
      });
      return items;
    }

    function show(name) {
      loadingEl.hidden = name !== "loading";
      emptyEl.hidden = name !== "empty";
      errorEl.hidden = name !== "error";
      listEl.hidden = name !== "list";
    }

    // 四个板块对应的中文标签
    var TYPE_LABEL = {
      doodle: "涂鸦",
      essay: "随笔",
      photo: "合影",
      res: "资源"
    };

    function render() {
      var items = getItems().filter(function (i) {
        if (filter === "all") return true;
        return i.type === filter;
      });

      // 空状态：筛选后没有内容
      if (items.length === 0) {
        var label = TYPE_LABEL[filter] || "";
        emptyEl.textContent = label ? (label + "内容待补充，敬请期待") : "这里还没有内容";
        show("empty");
        return;
      }

      var html = "";
      items.forEach(function (i) {
        var tag = TYPE_LABEL[i.type];
        // 资源类直接外链；涂鸦/随笔/合影带图的进详情页
        var href = (i.type === "res")
          ? (i.link || "#")
          : "work.html?title=" + encodeURIComponent(i.title) + "&cat=" + i.type;
        var thumb = i.img
          ? '<img class="list-thumb" src="' + i.img + '" alt="' + i.title + '">'
          : "";
        html +=
          '<a class="list-item" href="' + href + '">' +
            thumb +
            '<div class="list-body">' +
              '<h3 class="list-title">' + i.title + '</h3>' +
              '<p class="list-desc">' + i.desc + '</p>' +
              '<span class="tag">' + tag + '</span>' +
            '</div>' +
          '</a>';
      });
      listEl.innerHTML = html;
      show("list");
    }

    btns.forEach(function (btn) {
      btn.addEventListener("click", function () {
        btns.forEach(function (b) { b.classList.remove("is-active"); });
        btn.classList.add("is-active");
        filter = btn.getAttribute("data-filter");
        render();
      });
    });

    // 四种状态演示：地址后加 ?state=empty 或 ?state=error 可强制查看对应状态
    var params = new URLSearchParams(window.location.search);

    // 分类联动：首页四板块入口带 ?cat=doodle/essay/photo/res 跳过来，自动筛到对应板块
    var VALID_CATS = ["doodle", "essay", "photo", "res"];
    var cat = params.get("cat");
    if (VALID_CATS.indexOf(cat) !== -1) {
      filter = cat;
      btns.forEach(function (b) {
        b.classList.toggle("is-active", b.getAttribute("data-filter") === cat);
      });
    }

    var state = params.get("state");
    if (state === "error") {
      show("error");
    } else if (state === "empty") {
      show("empty");
    } else {
      // 模拟「加载中」→ 短暂延迟后渲染出列表
      show("loading");
      setTimeout(render, 400);
    }
  </script>
