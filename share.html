<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分享 · 个人主页</title>
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <div class="bubbles" aria-hidden="true">
    <i style="left:4%;width:9px;height:9px;animation-duration:6s;animation-delay:0s;"></i>
    <i style="left:9%;width:14px;height:14px;animation-duration:7.5s;animation-delay:-1s;"></i>
    <i style="left:14%;width:6px;height:6px;animation-duration:5s;animation-delay:-2s;"></i>
    <i style="left:19%;width:17px;height:17px;animation-duration:8.5s;animation-delay:-3s;"></i>
    <i style="left:24%;width:8px;height:8px;animation-duration:6.5s;animation-delay:-1.5s;"></i>
    <i style="left:26%;width:19px;height:19px;animation-duration:9s;animation-delay:-6.5s;"></i>
    <i style="left:29%;width:12px;height:12px;animation-duration:7s;animation-delay:-4s;"></i>
    <i style="left:34%;width:16px;height:16px;animation-duration:9s;animation-delay:-5s;"></i>
    <i style="left:39%;width:7px;height:7px;animation-duration:5.5s;animation-delay:-2.5s;"></i>
    <i style="left:44%;width:20px;height:20px;animation-duration:10s;animation-delay:-6s;"></i>
    <i style="left:49%;width:11px;height:11px;animation-duration:6s;animation-delay:-3.5s;"></i>
    <i style="left:54%;width:8px;height:8px;animation-duration:7.5s;animation-delay:-1s;"></i>
    <i style="left:59%;width:15px;height:15px;animation-duration:8s;animation-delay:-4.5s;"></i>
    <i style="left:64%;width:10px;height:10px;animation-duration:5.5s;animation-delay:-2s;"></i>
    <i style="left:69%;width:18px;height:18px;animation-duration:9.5s;animation-delay:-5.5s;"></i>
    <i style="left:74%;width:7px;height:7px;animation-duration:6s;animation-delay:-0.5s;"></i>
    <i style="left:79%;width:13px;height:13px;animation-duration:7s;animation-delay:-3s;"></i>
    <i style="left:84%;width:9px;height:9px;animation-duration:6.5s;animation-delay:-1.5s;"></i>
    <i style="left:89%;width:16px;height:16px;animation-duration:8.5s;animation-delay:-4s;"></i>
    <i style="left:94%;width:12px;height:12px;animation-duration:6.2s;animation-delay:-2.5s;"></i>
  </div>
  <main class="container">
    <a class="back" href="index.html">← 返回首页</a>

    <header class="share-head">
      <h1>分享</h1>
      <p class="share-sub">我公开的作品与资源</p>
    </header>

    <nav class="filter">
      <button class="filter-btn is-active" type="button" data-filter="all">全部</button>
      <button class="filter-btn" type="button" data-filter="work">作品</button>
      <button class="filter-btn" type="button" data-filter="res">资源</button>
    </nav>

    <div id="state-loading" class="state" hidden>加载中…</div>
    <div id="state-empty" class="state" hidden>这里还没有内容</div>
    <div id="state-error" class="state" hidden>加载出错了，请稍后再试</div>

    <div id="list" class="list"></div>
  </main>

  <script src="data.js"></script>
  <script>
    var loadingEl = document.getElementById("state-loading");
    var emptyEl = document.getElementById("state-empty");
    var errorEl = document.getElementById("state-error");
    var listEl = document.getElementById("list");
    var btns = document.querySelectorAll(".filter-btn");
    var filter = "all";

    // 把「作品 + 资源」合成一个列表
    function getItems() {
      var items = [];
      SITE_DATA.works.forEach(function (w) {
        items.push({ type: "work", title: w.title, desc: w.desc, img: w.img });
      });
      SITE_DATA.resources.forEach(function (r) {
        items.push({ type: "res", title: r.title, desc: r.desc, img: r.img || "", link: r.link || "" });
      });
      return items;
    }

    function show(name) {
      loadingEl.hidden = name !== "loading";
      emptyEl.hidden = name !== "empty";
      errorEl.hidden = name !== "error";
      listEl.hidden = name !== "list";
    }

    function render() {
      var items = getItems().filter(function (i) {
        if (filter === "work") return i.type === "work";
        if (filter === "res") return i.type === "res";
        return true;
      });

      // 空状态：筛选后没有内容
      if (items.length === 0) {
        emptyEl.textContent = filter === "res" ? "资源内容待补充，敬请期待" : "这里还没有内容";
        show("empty");
        return;
      }

      var html = "";
      items.forEach(function (i) {
        var tag = i.type === "work" ? "作品" : "资源";
        var href = i.type === "work"
          ? "work.html?title=" + encodeURIComponent(i.title)
          : (i.link || "#");
        var thumb = i.img
          ? '<img class="list-thumb" src="' + i.img + '" alt="' + i.title + '">'
          : "";
        html +=
          '<a class="list-item" href="' + href + '">' +
            thumb +
            '<div class="list-body">' +
              '<h3 class="list-title">' + i.title + '</h3>' +
              '<p class="list-desc">' + i.desc + '</p>' +
              '<span class="tag">' + tag + '</span>' +
            '</div>' +
          '</a>';
      });
      listEl.innerHTML = html;
      show("list");
    }

    btns.forEach(function (btn) {
      btn.addEventListener("click", function () {
        btns.forEach(function (b) { b.classList.remove("is-active"); });
        btn.classList.add("is-active");
        filter = btn.getAttribute("data-filter");
        render();
      });
    });

    // 四种状态演示：地址后加 ?state=empty 或 ?state=error 可强制查看对应状态
    var state = new URLSearchParams(window.location.search).get("state");
    if (state === "error") {
      show("error");
    } else if (state === "empty") {
      show("empty");
    } else {
      // 模拟「加载中」→ 短暂延迟后渲染出列表
      show("loading");
      setTimeout(render, 400);
    }
  </script>
</body>
</html>
