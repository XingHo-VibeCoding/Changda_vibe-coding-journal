  <script>
    var works = {
      "速写": { img: "img-sketch-hand.jpg", intro: "速写课第一节，画自己的手，感觉还不错，看来美术功底还在" },
      "涂鸦": { img: "img-doodle-math.jpg", intro: "emmm，我想想……" },
      "冲鸭": { img: "img-duck-chong.jpg", intro: "冲鸭！继续加油" }
    };
    var t = new URLSearchParams(window.location.search).get("title");
    if (t && works[t]) {
      var w = works[t];
      document.getElementById("work-title").textContent = t;
      document.getElementById("work-img").src = w.img;
      document.getElementById("work-img").alt = t;
      document.getElementById("work-intro").textContent = w.intro;
      document.getElementById("work-detail").hidden = false;
    } else {
      document.getElementById("not-found").hidden = false;
    }
  </script>
